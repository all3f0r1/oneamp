[package]
name = "oneamp-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "OneAmp core audio engine library"

[lib]
name = "oneamp_core"
path = "src/lib.rs"

# Documentation settings
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--enable-index-page", "-Z", "unstable-options"]

[dependencies]
# Audio decoding
symphonia.workspace = true

# Audio playback (optional, required for audio output)
cpal = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }

# Error handling
anyhow.workspace = true

# Channels for thread communication
crossbeam-channel.workspace = true

# WSZ skin support
zip.workspace = true
image.workspace = true

# Tag editing (read + write)
lofty.workspace = true

# HTTP client for internet-radio + podcast streaming
ureq.workspace = true

# FFT for spectrum visualization
rustfft.workspace = true

# Lock-free SPSC ring for the cpal output hot path
ringbuf.workspace = true

# Wait-free Arc swap for spectrum / waveform publication
arc-swap.workspace = true

# Serialization for presets and configuration
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }

# Real-time scheduling for the cpal callback thread (via rtkit on
# D-Bus) — fewer xruns under load. libdbus is already a build/runtime
# dependency of the desktop app (MPRIS), so this adds nothing new.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, optional = true, features = ["realtime-dbus"] }

[features]
default = ["audio", "serialization"]
# Audio feature: enables audio playback and ALSA support
# Disable this for documentation builds or minimal builds
audio = ["cpal", "rubato"]
# Serialization feature for presets and configuration
serialization = ["serde", "serde_json"]
