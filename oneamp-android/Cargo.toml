[package]
name = "oneamp-android"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Kotlin/JNI bridge to OneAmp's player and PCM processing chain"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Player + HTTP; output is pulled by the host (AudioTrack/AAudio), so no
# cpal, no skins, no tag editing.
oneamp-core = { path = "../oneamp-core", default-features = false, features = ["player", "http"] }
jni = "0.21"
serde.workspace = true
serde_json.workspace = true
