[package]
name = "oneamp-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "OneAmp - A Winamp-like audio player written in Rust - CLI version"

[[bin]]
name = "oneamp-cli"
path = "src/main.rs"

[dependencies]
# Audio playback (same engine as the desktop app). Only the player,
# HTTP and cpal: no skins, tag editing or desktop services.
oneamp-core = { path = "../oneamp-core", default-features = false, features = ["player", "http", "cpal-output"] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow.workspace = true

# Progress display
indicatif = "0.18"
