name: oneamp
summary: Pixel-perfect Winamp 2.x in Rust — plays your music, looks good doing it
description: |
  OneAmp is a native audio player in Rust, faithful to Winamp 2.x —
  your `.wsz` skins render pixel-perfect, your local library plays,
  internet radio streams, and the whole thing stays out of your way.

  Deliberately not a media library, not a CD ripper, not an iPod sync
  tool, not a podcast subscription manager. It's a music player. It
  plays music. It looks good doing it.

  Features:
    * Symphonia decoding (MP3, FLAC, OGG Vorbis, WAV, AAC, M4A / MP4,
      ALAC) with rodio / cpal output over a lock-free SPSC ring —
      no mutex on the cpal real-time callback.
    * Native pixel-perfect rendering of Winamp `.wsz` skins,
      hot-swappable via Alt+S.
    * 10-band RBJ-biquad equalizer at ISO 266 octave centres
      (±20 dB, constant-Q, click-free coefficient ramping) with
      16 built-in presets and `.eqf` import / export. Per-preset
      auto-preamp keeps heavy presets out of the brickwall limiter.
    * Internet radio + podcasts over HTTP / HTTPS (Ctrl+L), with
      live ICY now-playing metadata bridged to the playlist row.
    * Built-in tag editor on the playlist right-click menu
      (ID3v1/v2, Vorbis Comments, MP4 atoms, RIFF, APE) — preserves
      cover art, ReplayGain, MusicBrainz IDs.
    * Customisable playlist row template: `{artist}`, `{title}`,
      `{album}`, `{tracknumber}`, `{year}`, `{duration}`,
      `{filename}` — separators collapse on missing tags.
    * Gapless transitions, equal-power crossfade, ReplayGain track
      gain, Fletcher-Munson loudness compensation, constant-power
      stereo balance, pre-buffer brickwall limiter (-1 dBFS).
    * Spectrum analyzer (2048-point Hann FFT, dB-correct),
      oscilloscope (zero-crossing trigger, min/max decimation),
      peak / RMS meter visualizers.
    * M3U / PLS playlist load / save, drag-and-drop ingest of files
      and folders (recursive walk).
    * Track-change notifications, MPRIS2 media-bus integration,
      physical multimedia-key support, sleep timer, single-instance
      handoff, "Always on top" toggle.

icon: packaging/icons/oneamp-256.png

# Auto-bumped from `Cargo.toml` at build time — see the `oneamp`
# part below. `adopt-info` tells the store to pull the version (and
# version-script) from that part instead of a hard-coded line here.
adopt-info: oneamp

base: core22
# `strict` confines the snap to declared `plugs` — required for store
# publication. We expose audio + home + removable-media + network so
# users can play their music library and we can run the GitHub update
# check at startup; nothing else.
confinement: strict
grade: stable
compression: lzo
license: MIT

# x86_64 only for now. arm64 needs a Snap-side cross-compile or a
# native runner; the existing release artifacts don't cover ARM Linux
# either, so this isn't a regression.
architectures:
  - build-on: amd64
    build-for: amd64

apps:
  oneamp:
    command: bin/oneamp
    # `desktop` extension wires up `XDG_*` env, fontconfig, icon
    # themes, the GTK / wayland / x11 / opengl plugs, and the
    # standard desktop-session integration. Without it the egui /
    # wgpu stack starts in a corner of confined hell where no
    # fonts render and Wayland refuses the surface.
    extensions:
      - gnome
    common-id: io.github.all3f0r1.OneAmp
    desktop: usr/share/applications/io.github.all3f0r1.OneAmp.desktop
    plugs:
      - audio-playback
      - alsa
      - pulseaudio
      - home
      - removable-media
      - mount-observe
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - unity7

parts:
  oneamp:
    plugin: nil
    source: .
    source-type: local
    build-packages:
      - build-essential
      - pkg-config
      - curl
      - ca-certificates
      - libasound2-dev
      - libxcb-render0-dev
      - libxcb-shape0-dev
      - libxcb-xfixes0-dev
      - libxkbcommon-dev
      - libdbus-1-dev
      - libwayland-dev
    stage-packages:
      - libasound2
      - libxkbcommon0
      - libwayland-client0
      - libegl1
      - libgl1
      - libdbus-1-3
    # core22 (Ubuntu 22.04) ships rustc 1.61 which is too old for the
    # workspace and the egui fork. Install a current stable via
    # rustup into the build environment, then drive cargo directly.
    # `craftctl set version` pipes the workspace version (the same
    # awk used by build-deb.sh / build-mac-app.sh) back into the snap
    # metadata.
    override-pull: |
      craftctl default
      VERSION="$(awk '/^\[workspace\.package\]/{f=1; next} f && /^version[[:space:]]*=/{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.toml)"
      craftctl set version="${VERSION}"
    override-build: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --default-toolchain stable --profile minimal
      source "$HOME/.cargo/env"
      cargo build --release -p oneamp-desktop --locked
      install -Dm755 target/release/oneamp \
        "${CRAFT_PART_INSTALL}/bin/oneamp"
      install -Dm644 packaging/io.github.all3f0r1.OneAmp.desktop \
        "${CRAFT_PART_INSTALL}/usr/share/applications/io.github.all3f0r1.OneAmp.desktop"
      install -Dm644 packaging/io.github.all3f0r1.OneAmp.metainfo.xml \
        "${CRAFT_PART_INSTALL}/usr/share/metainfo/io.github.all3f0r1.OneAmp.metainfo.xml"
      for size in 16 32 48 64 128 256 512; do
        install -Dm644 "packaging/icons/oneamp-${size}.png" \
          "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/${size}x${size}/apps/io.github.all3f0r1.OneAmp.png"
      done
